short_bio: >-
  <p>
   I am Wentao Shen, a two-year Master student at the College of Intelligent Systems Science and Engineering, 
   Harbin Engineering University (<a href="https://www.hrbeu.edu.cn/" target="_blank">HEU</a>), majoring in Artificial Intelligence，advised by <a href="https://faculty.hrbeu.edu.cn/FengZhiGuang/zh_CN/zdylm/304357/list/index.htm" target="_blank">Prof. Zhiguang Feng</a>.
   Before that, I received my B.Eng. degree in Marine Robotics from HEU in 2024.
  </p>
  <p>
    My current research interests include knowledge graphs and federated learning, as well as data-driven control,
    model predictive control, deep reinforcement learning, and path planning, particularly for applications in 
    autonomous underwater vehicles (AUV). If you are interested with my research, please feel free to contact me.
  </p>

